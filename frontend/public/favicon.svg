<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark green rounded background -->
  <rect width="100" height="100" rx="18" fill="#1b5e20"/>

  <!-- Snake body - S-curve from bottom-left to top-right -->
  <path d="M 30 82 C 72 82 72 55 40 50 C 15 45 22 12 68 12"
        stroke="#66bb6a" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="73" cy="12" rx="12" ry="9" fill="#66bb6a"/>

  <!-- Eye -->
  <circle cx="77" cy="9" r="3" fill="#0d1f09"/>
  <circle cx="76" cy="8" r="1.2" fill="white" opacity="0.5"/>

  <!-- Forked tongue -->
  <path d="M 83 12 L 93 9 M 93 9 L 97 6 M 93 9 L 97 12"
        stroke="#c62828" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
